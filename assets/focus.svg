<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" role="img" aria-labelledby="ht">
<title id="ht">Research areas: perception safety, safety and security, uncertainty, education</title>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .hv { font-size: 40px; fill: #5ad1f0; }
  .hu { font-size: 24px; font-weight: 650; fill: #eef3fa; }
  .hn { font-size: 17px; fill: #93a6c2; }
  .tile { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.2s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g class="tile" style="animation-delay:0.00s"><rect x="20" y="14" width="370" height="180" rx="14" fill="#111b33" stroke="#24365a"/><rect class="bar" x="42" y="36" width="36" height="3" rx="1.5" fill="#5ad1f0" style="animation-delay:0.30s"/><text class="hv" x="42" y="88">◎</text><text class="hu" x="42" y="124">Perception safety</text><text class="hn" x="42" y="152"><tspan x="42" dy="0">performance limitations and</tspan><tspan x="42" dy="23">triggering conditions</tspan></text></g><g class="tile" style="animation-delay:0.25s"><rect x="410" y="14" width="370" height="180" rx="14" fill="#111b33" stroke="#24365a"/><rect class="bar" x="432" y="36" width="36" height="3" rx="1.5" fill="#5ad1f0" style="animation-delay:0.55s"/><text class="hv" x="432" y="88">⛨</text><text class="hu" x="432" y="124">Safety and security</text><text class="hn" x="432" y="152"><tspan x="432" dy="0">functional safety, SOTIF,</tspan><tspan x="432" dy="23">cybersecurity and AI safety</tspan></text></g><g class="tile" style="animation-delay:0.50s"><rect x="20" y="214" width="370" height="180" rx="14" fill="#111b33" stroke="#24365a"/><rect class="bar" x="42" y="236" width="36" height="3" rx="1.5" fill="#5ad1f0" style="animation-delay:0.80s"/><text class="hv" x="42" y="288">∿</text><text class="hu" x="42" y="324">Uncertainty</text><text class="hn" x="42" y="352"><tspan x="42" dy="0">uncertainty estimation and runtime</tspan><tspan x="42" dy="23">monitoring</tspan></text></g><g class="tile" style="animation-delay:0.75s"><rect x="410" y="214" width="370" height="180" rx="14" fill="#111b33" stroke="#24365a"/><rect class="bar" x="432" y="236" width="36" height="3" rx="1.5" fill="#5ad1f0" style="animation-delay:1.05s"/><text class="hv" x="432" y="288">✦</text><text class="hu" x="432" y="324">Education</text><text class="hn" x="432" y="352"><tspan x="432" dy="0">hands-on material from school level</tspan><tspan x="432" dy="23">to engineering practice</tspan></text></g>
</svg>
